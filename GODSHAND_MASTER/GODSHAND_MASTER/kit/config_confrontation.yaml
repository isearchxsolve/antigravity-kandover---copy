  keep_glitch_threshold: 0.66
# 4K cinema delivery block (consumed by clips.py / stitch.py / qc.py when
# KIT_4K_DELIVERY=1 is set). Render pipeline still produces the 1280x704
# shot frames; the master encoder upscales + emits a 10-bit Rec.709 4K master.
# Env KIT_4K_DELIVERY=1 overrides `enabled`.
delivery:
  enabled: false              # also toggled by KIT_4K_DELIVERY env (env wins)
  width: 3840
  height: 2160
  pix_fmt: yuv420p10le         # 10-bit 4:2:0 (Rec.709 SDR)
  color_primaries: bt709       # streaming-grade color science
  color_trc: bt709
  colorspace: bt709
  video_bitrate: 120M          # cinematic floor for 4K24 H.264
  audio_bitrate: 320k
  master_crf: null             # bitrate mode (no CRF) for master path

# Theatrical (DCI) delivery block — opt-in via KIT_THEATRICAL=1 env var.
# When enabled, emits: DCDM (JPEG 2000 XYZ 12-bit), DCP (MXF + CPL),
# 5.1/7.1 surround audio, P3-D65 SDR + HDR PQ masters, DCI 4K flat/scope.
theatrical:
  enabled: false
  aspect: flat                 # flat (1.85) | scope (2.39) | full (1.90)
  dci_4k: true                 # true -> 4096 canvas; false -> 2K (2048x1080)
  hdr: true                    # true -> also emit PQ ST 2084 HDR master
  surround_layout: 5.1         # 5.1 | 7.1
  dcdm_jpeg2000: true          # true -> JPEG 2000 DCDM; false -> uncompressed TIFF DCDM
  dcp_encrypt: false           # true -> KDM-ready encryption stub (not real crypto)
  video_bitrate: 250M          # DCDM bitrate
  audio_bitrate: 384k          # DCP audio bitrate (WAV inside MXF is uncompressed)
  max_reel_seconds: 10800      # max seconds per reel (~3h)
audio_master:
  sample_rate: 48000
  bit_depth: 24
  loudness_target: -14
  loudness_range: 10
  true_peak: -1.0
  limiter_ceiling: -0.3
  stereo_enhance: 0.25
  reverb_send: -8
  reverb_decay: 2.2
  deesser_threshold: 0.3
  sidechain_ratio: 12
  sidechain_attack: 3
  sidechain_release: 250
grain:
  enabled: true
  strength: 4.5
  size: 1.0
  chroma: 0.6
  halation: 0.25
identity: {}
