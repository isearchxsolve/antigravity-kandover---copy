    airbrushed, over-smooth, waxy skin, doll-like, mannequin, artificial lighting,
    flat lighting, overexposed, underexposed, oversaturated, desaturated, unnatural
    colors, deformity, anatomical error, extra fingers, missing fingers, bad anatomy,
    distorted face, blurred face, low quality, worst quality, watermark, signature,
    text, logo, border, frame, anime, manga, stylized, abstract, surreal
intensity:
  keep_glitch_threshold: 0.66
