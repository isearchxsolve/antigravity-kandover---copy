  positive: photographed on real film, genuine human expression, natural skin texture,
    subsurface scattering, true-to-life lighting, cinematic color grading, filmic
    depth of field, sharp focus on subject, authentic emotions, realistic proportions
    and anatomy, lived-in expressions
