  drift_cosine: 0.25
  sample_frames: 20
  min_det_score: 0.7
audio_master:
  sample_rate: 48000
  bit_depth: 24
  loudness_target: -14
  loudness_range: 10
  true_peak: -1.0
  limiter_ceiling: -0.3
  stereo_enhance: 0.25
  reverb_send: -8
  reverb_decay: 2.2
  deesser_threshold: 0.3
  sidechain_ratio: 12
  sidechain_attack: 3
  sidechain_release: 250
grain:
  enabled: true
  strength: 4.5
  size: 1.0
  chroma: 0.6
  halation: 0.25
